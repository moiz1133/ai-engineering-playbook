[project]
name = "production-tools"
version = "0.1.0"
description = "Six standalone, production-quality tools for AI agents -- usable with any LLM or framework."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "sqlparse>=0.5",
    "docker>=7.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
